<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Aviation Drills">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#eef2f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1722" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>:root{color-scheme:light dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;-webkit-text-size-adjust:100%}[hidden]{display:none!important}</style>
<title>Aviation Drills</title>
<style>
/* Layout: chart-paper column; the drill card is the whole page */
:root{
  --paper:#eef2f5; --panel:#ffffff; --ink:#14243a; --muted:#5b6b7f; --rule:#d3dbe4;
  --magenta:#b0247a; --magenta-soft:#f7e3ef; --good:#1d7a4a; --good-soft:#e1f2e8; --bad:#b33a2b; --bad-soft:#f8e4e1;
  --t-rule:#bbf7d0; --t-pat:#bfdbfe; --t-sq:#fde68a; --t-core:#fecaca; --t-mir:#f1f3f5;
  --display:"Avenir Next Condensed","Arial Narrow",system-ui,sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0f1722; --panel:#172231; --ink:#e3eaf2; --muted:#93a3b6; --rule:#2a394b;
  --magenta:#ec6ab5; --magenta-soft:#3a1c30; --good:#5cc78e; --good-soft:#143025; --bad:#f08a7a; --bad-soft:#3a1d1a; --t-rule:#1c4231; --t-pat:#1f3654; --t-sq:#4d3f12; --t-core:#4d2424; --t-mir:#1b2633; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0f1722; --panel:#172231; --ink:#e3eaf2; --muted:#93a3b6; --rule:#2a394b;
  --magenta:#ec6ab5; --magenta-soft:#3a1c30; --good:#5cc78e; --good-soft:#143025; --bad:#f08a7a; --bad-soft:#3a1d1a; --t-rule:#1c4231; --t-pat:#1f3654; --t-sq:#4d3f12; --t-core:#4d2424; --t-mir:#1b2633; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:36px}
h1,h2{font-family:var(--display);font-weight:700;letter-spacing:.01em;text-wrap:balance;margin:0;line-height:1.05}
h1{font-size:2.6rem}
h2{font-size:1.7rem}


/* drill */
.drill{background:var(--panel);border:2px solid var(--magenta);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:16px}
.drill-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.stats{display:flex;gap:16px;font-family:var(--mono);font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.stats strong{color:var(--ink);font-weight:600;display:inline-block}
.top-right{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.btn.sm{padding:6px 12px;font-size:.85rem}
.prog{height:4px;border-radius:2px;background:var(--rule);overflow:hidden;margin-top:-6px}
.ses-info{font-family:var(--mono);font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:-6px}
.prog i{display:block;height:100%;width:0;background:var(--magenta);transition:width .3s ease}
.play{display:flex;flex-direction:column;gap:16px}
.start{display:flex;flex-direction:column;gap:14px;align-items:flex-start;border-top:1px solid var(--rule);padding-top:16px}
.start h3,.summary h3{font-family:var(--display);font-size:1.35rem;margin:0}
.count-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.lbl{font-family:var(--mono);font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.stepper{display:flex;align-items:stretch;border:1px solid var(--rule);border-radius:10px;background:var(--paper);overflow:hidden}
.stepper button{width:44px;border:0;background:transparent;color:var(--ink);font:600 1.3rem var(--body);cursor:pointer}
.stepper button:focus-visible,.stepper input:focus-visible{outline:2px solid var(--magenta);outline-offset:-2px}
.stepper input{width:3.5ch;border:0;background:transparent;color:var(--ink);font:600 1.3rem var(--mono);text-align:center;padding:8px 0;font-variant-numeric:tabular-nums}
.est{font-size:.88rem;color:var(--muted)}
.summary{display:flex;flex-direction:column;gap:18px;align-items:flex-start;border-top:1px solid var(--rule);padding-top:16px}
.score{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.pct{font-family:var(--display);font-weight:700;font-size:4.2rem;line-height:1;font-variant-numeric:tabular-nums}
.pct small{font-size:.45em;margin-left:2px}
.score.hi .pct{color:var(--good)} .score.mid .pct{color:var(--magenta)} .score.lo .pct{color:var(--bad)}
.vword{font-weight:600;font-size:1.15rem}
.smeta{color:var(--muted);font-size:.9rem;line-height:1.5}
.bk{border-collapse:collapse;width:100%;max-width:440px;font-size:.92rem;font-variant-numeric:tabular-nums}
.bk th{font-family:var(--mono);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:500;text-align:left;padding:0 8px 6px 0}
.bk td{padding:7px 8px 7px 0;border-top:1px solid var(--rule)}
.bk td:not(:first-child),.bk th:not(:first-child){text-align:right;font-family:var(--mono)}
.misses{display:flex;flex-direction:column;gap:8px;width:100%}
.misses ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:.92rem}
.misses li span{display:block}
.misses li b{font-family:var(--mono);font-size:.85rem;color:var(--bad);font-weight:600}
.mode{display:flex;flex-direction:column;gap:6px}
.controls{display:flex;flex-wrap:wrap;gap:14px 16px;align-items:flex-end}
.controls .mode{flex:1 1 200px;min-width:0}
.mode label,.mode .lbl{font-family:var(--mono);font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.mode select{font:500 1rem var(--body);color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:10px 12px;width:100%;max-width:340px;cursor:pointer}
.seg{display:flex;border:1px solid var(--rule);border-radius:10px;background:var(--paper);padding:3px;gap:3px;max-width:340px}
.seg button{flex:1;font:500 .95rem var(--body);color:var(--muted);background:transparent;border:0;border-radius:7px;padding:8px 6px;cursor:pointer}
.seg button[aria-checked="true"]{background:var(--magenta);color:#fff;font-weight:600}
.seg.locked button{cursor:default}
.seg.locked button[aria-checked="false"]{opacity:.45}
.xw-fig{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.xw-svg{width:100%;max-width:330px;height:auto;display:block}
.close-row{display:flex;flex-wrap:wrap;gap:4px 18px;margin:0;font-size:.92rem;color:var(--muted)}
.close-row b{font-family:var(--mono);color:var(--ink);font-variant-numeric:tabular-nums}
.tzt-wrap{overflow-x:auto;margin-top:4px}
.tzt{border-collapse:separate;border-spacing:5px;font-variant-numeric:tabular-nums}
.tzt caption{text-align:left;font-size:.86rem;color:var(--muted);padding:0 5px 4px}
.tzt th{font:600 .9rem var(--body);color:var(--ink);text-align:left;padding:0 10px 0 0}
.tzt thead th{text-align:center;font-size:.85rem;padding:0 0 2px}
.tzt thead small{display:block;font-weight:400;color:var(--muted);font-size:.75rem}
.tzt td{width:5.6rem;text-align:center;border-radius:10px;padding:8px 4px;color:var(--ink)}
.tzt td b{display:block;font:700 1.6rem/1.1 var(--mono)}
.tzt td span{font:500 .75rem var(--mono);color:var(--muted)}
.tzt .o4{background:var(--t-mir)} .tzt .o5{background:var(--t-pat)} .tzt .o6{background:var(--t-rule)} .tzt .o7{background:var(--t-sq)} .tzt .o8{background:var(--t-core)}
.tzt td.hl{box-shadow:inset 0 0 0 3px var(--magenta)}
#dash.dash{border-top:0;padding-top:0;margin-top:0}
.dash.more{border-top:1px solid var(--rule);padding-top:16px;margin-top:6px}
.dash.more{align-items:flex-start}
.dash.more:empty{display:none}
h3.ns{border-top:1px solid var(--rule);padding-top:16px;width:100%}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--rule);margin-top:-4px}
.tabs button,.sk tbody tr,.seg button,.btn{-webkit-tap-highlight-color:transparent}
.tabs button{font:600 .98rem var(--body);color:var(--muted);background:transparent;border:0;border-bottom:3px solid transparent;padding:10px 14px 9px;cursor:pointer;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--magenta)}
.tabs button:focus-visible{outline:2px solid var(--magenta);outline-offset:-2px;border-radius:6px}
.progress{display:flex;flex-direction:column;gap:24px}
.progress>.btn{align-self:flex-start}
.progress section{display:flex;flex-direction:column;gap:10px}
.progress h3{font-family:var(--display);font-size:1.25rem;margin:0}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.tile{background:var(--paper);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile b{font:700 1.6rem/1.1 var(--mono);font-variant-numeric:tabular-nums;color:var(--ink)}
.tile span{font-size:.82rem;color:var(--muted)}
.tile em{font-style:normal;font-weight:600;display:block}.tile em.up{color:var(--good)}.tile em.down{color:var(--bad)}
@media (max-width:520px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.trend{width:100%;height:auto;display:block;max-width:640px}
.bars{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px;max-width:560px}
.bar-head{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:500}
.bar{height:8px;border-radius:4px;background:var(--rule);overflow:hidden;margin:6px 0 4px}
.bar i{display:block;height:100%;border-radius:4px}
.bar i.weak{background:var(--bad)}.bar i.ok{background:var(--magenta)}.bar i.strong{background:var(--good)}
.bar-meta{font-size:.84rem;color:var(--muted)}.bar-meta b{color:var(--ink);font-family:var(--mono)}
.misslog{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;max-width:640px}
.misslog li{border-top:1px solid var(--rule);padding:9px 0;display:flex;flex-direction:column;gap:3px}
.mq{font-size:.92rem}.ma{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:.82rem;color:var(--muted)}
.ma b{font-family:var(--mono);color:var(--bad);font-weight:600}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:.9rem;max-width:640px}
.hist li{display:grid;grid-template-columns:1fr auto;gap:0 12px;align-items:baseline;border-top:1px solid var(--rule);padding-top:6px}
.hist li b{font-family:var(--mono)}.hist li b.hi{color:var(--good)}.hist li b.mid{color:var(--magenta)}.hist li b.lo{color:var(--bad)}
.hist li em{font-style:normal;color:var(--muted);font-size:.82rem;grid-column:1/-1}
.start-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.btn:disabled{opacity:.45;cursor:not-allowed}
.quick{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sk .ck{width:34px;padding-right:4px}
.bk.sk{max-width:560px}
.bk.sk td:nth-child(2),.bk.sk th:nth-child(2){text-align:left;font-family:var(--body)}
.sk input[type=checkbox]{width:20px;height:20px;accent-color:var(--magenta);cursor:pointer;margin:0;vertical-align:middle}
.sk tbody tr{cursor:pointer}
.sk tbody tr:not(.on) td:not(.ck){opacity:.5}
.sk label{cursor:pointer}
.mult-note{margin:0;font-size:.88rem;color:var(--muted);max-width:52ch;flex-basis:100%}
.dash{display:flex;flex-direction:column;gap:14px;width:100%;border-top:1px solid var(--rule);padding-top:16px;margin-top:6px}
.dash h3{margin:0}
.dash-empty p,.dmeta,.note{margin:0;color:var(--muted);font-size:.88rem;max-width:60ch}
.dmeta b{color:var(--ink);font-weight:600}
.tbl-wrap{overflow-x:auto;width:100%}
.sk td:last-child,.sk th:last-child{text-align:right}
.chip{display:inline-block;font:600 .74rem var(--body);padding:3px 8px;border-radius:999px;white-space:nowrap}
.chip.strong{background:var(--good-soft);color:var(--good)} .chip.ok{background:var(--t-sq);color:var(--ink)} .chip.weak{background:var(--bad-soft);color:var(--bad)} .chip.none{background:var(--t-mir);color:var(--muted)}
.heat-wrap{display:flex;flex-direction:column;gap:10px;width:100%}
.heat{display:grid;grid-template-columns:repeat(9,1fr);gap:3px;max-width:400px;width:100%;font-family:var(--mono);font-size:.85rem;font-variant-numeric:tabular-nums}
.heat>*{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:4px;min-width:0}
.heat .hd{background:var(--ink);color:var(--panel);font-weight:600}
.heat .c{border:0;font:inherit;cursor:pointer;color:var(--ink);padding:0}
.heat .c.sel,.bchip.sel{box-shadow:inset 0 0 0 2.5px var(--magenta)}
.heat .c{-webkit-tap-highlight-color:transparent}
.heat .c:focus-visible,.bchip:focus-visible{outline:2px solid var(--magenta);outline-offset:1px}
.c.miss,.legend i.miss,.bchip.miss{background:var(--t-core);color:var(--bad);font-weight:700}
.c.slow,.legend i.slow,.bchip.slow{background:var(--t-sq)}
.c.good,.legend i.good,.bchip.good{background:var(--t-rule)}
.c.none,.legend i.none,.bchip.none{background:var(--t-mir);color:var(--muted)}
.bridge{display:flex;flex-wrap:wrap;gap:8px}
.bchip{border:0;font:600 .9rem var(--mono);padding:8px 14px;border-radius:8px;cursor:pointer;color:var(--ink)}
.cell-info{margin:0;font-size:.86rem;color:var(--muted);min-height:1.4em}
.recent{display:flex;flex-direction:column;gap:8px;width:100%}
.recent ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:.9rem}
.recent li{display:grid;grid-template-columns:1fr auto;gap:0 12px;align-items:baseline;border-top:1px solid var(--rule);padding-top:6px}
.recent li span{min-width:0}
.recent li b{font-family:var(--mono);font-variant-numeric:tabular-nums}
.recent li b.hi{color:var(--good)} .recent li b.mid{color:var(--magenta)} .recent li b.lo{color:var(--bad)}
.recent li em{font-style:normal;color:var(--muted);font-size:.82rem;grid-column:1/-1}
.btn.danger{border-color:var(--bad);color:var(--bad)}
@media (max-width:400px){.heat{font-size:.74rem;gap:2px}}
.lock{text-transform:none;letter-spacing:0;font-family:var(--body);font-size:.8rem}
.seg button:focus-visible{outline:2px solid var(--magenta);outline-offset:1px}
.mode select:focus-visible{outline:2px solid var(--magenta);outline-offset:2px}
.btn:focus-visible,input:focus-visible{outline:2px solid var(--magenta);outline-offset:2px}
.qtype{font-family:var(--mono);font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.question{font-size:1.25rem;font-weight:500;line-height:1.45;margin:4px 0 0}
.question .n{font-family:var(--mono);font-weight:600;color:var(--magenta)}
.answer-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.field{display:flex;align-items:center;border:1px solid var(--rule);border-radius:10px;background:var(--paper);padding:0 12px;flex:1 1 180px;min-width:0}
.field input{border:0;background:transparent;color:var(--ink);font:600 1.4rem var(--mono);padding:10px 0;width:100%;min-width:0;outline:none}
.field .unit{font-family:var(--mono);color:var(--muted);font-size:.9rem;white-space:nowrap}
.btn{font:600 .95rem var(--body);border-radius:10px;padding:12px 18px;cursor:pointer;border:1px solid var(--magenta);background:var(--magenta);color:#fff}
.btn{transition:background-color .2s,border-color .2s}
.btn.ok{background:var(--good);border-color:var(--good);color:#fff}
.question{transition:opacity .25s}
.question.done{opacity:.35}
.spark{position:fixed;width:9px;height:9px;border-radius:50%;pointer-events:none;z-index:50}
.spark.sq{border-radius:2px}
@media (prefers-reduced-motion:no-preference){.btn.ok{animation:pop .45s cubic-bezier(.3,1.7,.5,1)}@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.14)}100%{transform:scale(1)}}}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--rule)}
.timer{font-family:var(--mono);font-size:.9rem;color:var(--muted);font-variant-numeric:tabular-nums;min-width:4ch}
.result{border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.result.good{background:var(--good-soft)}
.result.bad{background:var(--bad-soft)}
.result.reveal{background:var(--magenta-soft)}
.verdict{font-weight:600}
.good .verdict{color:var(--good)} .bad .verdict{color:var(--bad)}
.steps{margin:0;padding-left:20px;font-family:var(--mono);font-size:.88rem;line-height:1.7}
.say{font-size:.9rem;color:var(--muted);margin:0}
.say em{font-style:normal;color:var(--ink)}

.mt{display:grid;grid-template-columns:repeat(11,1fr);gap:2px;font-family:var(--mono);font-size:.82rem;font-variant-numeric:tabular-nums;max-width:440px;width:100%}
.mt div{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:3px;color:var(--ink)}
.mt .hd{background:var(--ink);color:var(--panel);font-weight:600}
.mt .hd.on{background:var(--magenta);color:#fff}
.mt .rule{background:var(--t-rule)} .mt .pat{background:var(--t-pat)} .mt .sq{background:var(--t-sq);font-weight:600}
.mt .core{background:var(--t-core);color:var(--bad);font-weight:600}
.mt .mir{background:var(--t-mir);color:var(--muted);opacity:.7}
.mt .hit{box-shadow:inset 0 0 0 2.5px var(--magenta);opacity:1;font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;color:var(--muted);margin:0;padding:0;list-style:none}
.legend li{display:flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:2px;display:inline-block}
@media (max-width:400px){.mt{font-size:.7rem;gap:1px}}
@media (max-width:480px){h1{font-size:2.1rem} .question{font-size:1.1rem}}
@media (prefers-reduced-motion:no-preference){.result{animation:in .18s ease-out}@keyframes in{from{transform:translateY(4px)}to{transform:none}}}
</style>
</head>
<body>

<div class="wrap">


  <section class="drill" aria-label="Practice drill">
    <div class="drill-top">
      <h2>Aviation Drills</h2>
      <div class="top-right">
        <div class="stats" id="stats" aria-live="polite" hidden>
          <span>Q <strong id="sQ">1</strong>/<strong id="sN">20</strong></span>
          <span>Right <strong id="sRight">0/0</strong></span>
          <span>Avg <strong id="sAvg">–</strong></span>
        </div>
        <button class="btn ghost sm" type="button" id="stopBtn" hidden>End</button>
      </div>
    </div>
    <div class="prog" id="prog" hidden><i id="progBar"></i></div>
    <div class="ses-info" id="sesInfo" hidden></div>
    <div class="tabs" id="tabs" role="tablist" aria-label="Sections"><button type="button" role="tab" id="tab-new" data-tab="new">New session</button><button type="button" role="tab" id="tab-prog" data-tab="prog">Progress</button></div>
    <div class="controls" id="controls">
      <p class="mult-note" id="multNote" hidden>Adaptive: times table facts plus mental shortcuts like × 1,500, ÷ 2,500, ÷ 60 and halves. Weak and slow items come back more often.</p>
      <div class="mode" id="lvlWrap">
        <span class="lbl" id="lvlLbl">Difficulty</span>
        <div class="seg" id="lvl" role="radiogroup" aria-labelledby="lvlLbl">
        </div>
      </div>
    </div>
    <div class="start" id="startView">
      <div class="dash" id="dash"></div>
      <h3 class="ns">New session</h3>
      <div class="count-row">
        <span class="lbl" id="countLbl">Questions</span>
        <div class="stepper" role="group" aria-labelledby="countLbl">
          <button type="button" id="cMinus" aria-label="5 fewer questions">−</button>
          <input id="count" inputmode="numeric" value="20" aria-label="Number of questions">
          <button type="button" id="cPlus" aria-label="5 more questions">+</button>
        </div>
        <span class="est" id="est">about 5 min</span>
      </div>

        unit:'fpm',ans:vs,tol:100,steps:[`Feet ÷ minutes: ${fmt(alt)} ÷ ${m}`,...divSteps(alt,m)],say:'Feet divided by minutes.'};}
    if(v===2){const vs=pick([1000,1500,2000,2500,3000]),m=pick([3,4,5,6,8,10]),to=R(3,12)*1000,from=to+vs*m;
      return{q:pick([`Descending at ${N(fmt(vs)+' fpm')} from ${N(fl(from))} to ${N(fl(to))}. How many minutes?`,`How long to get from ${N(fl(from))} down to ${N(fl(to))} at ${N(fmt(vs)+' fpm')}?`]),
        unit:'min',ans:m,tol:0.5,steps:[`${fmt(from)} − ${fmt(to)} = ${fmt(from-to)} ft`,...divSteps(from-to,vs)],say:'Feet to lose divided by the rate.'};}
    const gs=pick(GS60.slice(1)),min=pick([2,3,4,5,6]),npm=gs/60,nm=npm*min,vs=pick(VSR),alt=vs*min;

      return{q:`ATC: "Cross ${fix} at ${N(fl(to))}." You're at ${N(fl(from))}, ${N(nm+' nm')} from ${fix}, groundspeed ${N(gs+' kt')}. What descent rate do you need?`,unit:'fpm',ans:vs,tol:100,
        steps:[`${fmt(from)} − ${fmt(to)} = ${fmt(alt)} ft`,`${gs} ÷ 60 = ${npm} nm/min → ${nm} ÷ ${npm} = ${min} min`,...divSteps(alt,min)],say:'Altitude to lose, time to the fix, then divide.'};}
    return{q:pick([`You need to lose ${N(fmt(alt)+' ft')} in ${N(nm+' nm')} at ${N(gs+' kt')} groundspeed. What vertical speed?`,`${N(nm+' miles')} to go, ${N(fmt(alt)+' ft')} to lose, ${N(gs+' kt')} over the ground. Rate?`]),unit:'fpm',ans:vs,tol:100,
      steps:[`${gs} ÷ 60 = ${npm} nm/min`,`${nm} ÷ ${npm} = ${min} min`,...divSteps(alt,min)],say:'Turn distance into minutes, then divide the altitude.'};}},

  wind:{label:'Time with wind',gen(){
    const dv=Math.random()<.35,head=Math.random()<.6,w=R(1,8)*10,gs=pick((dv?GS30:GS60).filter(g=>head?g+w<=540:g-w>=150)),tas=head?gs+w:gs-w,wn=`${w} kt ${head?'headwind':'tailwind'}`;

        unit:'nm',ans:d,tol:0.5,steps:[`GS = ${tas} ${head?'−':'+'} ${w} = ${gs} kt`,`${gs} ÷ 60 = ${gs/60} nm/min`,...mulSteps(gs/60,m)],say:'Groundspeed, nm per minute, times the minutes.'};}

      unit:'min',ans:min,tol:0.5,steps:[`GS = ${tas} ${head?'−':'+'} ${w} = ${gs} kt`,`${gs} ÷ 60 = ${gs/60} nm/min`,...divSteps(dist,gs/60)],say:'Groundspeed first, then distance over groundspeed.'};}},

  npm:{label:'GS to nm/min',gen(){

      steps:table?[`Every 30 kt = 0.5 nm/min`,...divSteps(gs,60)]:divSteps(gs,60),say:'Groundspeed divided by 60. Every 30 knots is half a mile a minute.'};}},

  fuel:{label:'Fuel dump time',gen(){

  hold:{label:'Fuel & holding',gen(){

    if(v===2){const gs=pick([240,300,360,420]),t=holdMin(pm,[10,15,20,30]),d=gs/60*t,h=holdMin(pm,[10,15,20,25,30]),res=pick([4500,5000,6000]),dv=pm*t,fob=res+dv+pm*h;

    if(v===3){if(Math.random()<.5)return{q:pick([`Burning ${N(fmt(ph)+' lb/hr')}. How much is that per minute?`,`${N(fmt(ph)+' lb per hour')} is how many pounds per minute?`]),unit:'lb/min',ans:pm,tol:0,steps:divSteps(ph,60),say:'Per hour divided by 60: drop a zero, divide by 6.'};
      return{q:`Burning ${N(pm+' lb/min')}. What's that per hour?`,unit:'lb/hr',ans:ph,tol:0,steps:mulSteps(pm,60),say:'Per minute times 60.'};}
    if(v===4){const hi=Math.random()<.5,pt=hi?5:4,k=R(2,6),efc=pt*k,alt=hi?pick([15000,16000,17000,18000]):pick([6000,8000,10000,12000,14000]);
      return{q:pick([`Holding at ${N(fl(alt))}, no wind, standard pattern. EFC in ${N(efc+' minutes')}. How many full patterns will you fly?`,`Standard hold at ${N(fl(alt))}. Expect further clearance in ${N(efc+' min')}. How many laps?`]),
        unit:'patterns',ans:k,tol:0,steps:[`${hi?'Above':'At or below'} 14,000 ft the inbound leg is ${hi?'1.5 minutes':'1 minute'}`,`Two 1-minute turns + ${hi?'3':'2'} minutes of legs = ${pt} minutes per pattern`,`${efc} ÷ ${pt} = ${k} patterns`],
        say:'Pattern time is about 4 minutes at or below 14,000 ft and about 5 above.'};}
    const m=holdMin(pm,[10,15,20,30,45]),used=pm*m;
    return{q:pick([`Holding for ${N(m+' minutes')} at ${N(fmt(ph)+' lb/hr')}. How much fuel does that cost?`,`How much fuel do you burn in a ${N(m+'-minute')} hold at ${N(fmt(ph)+' lb/hr')}?`]),
      unit:'lb',ans:used,tol:50,steps:[...perMin,...mulSteps(pm,m)],say:'Convert to per minute, then multiply by the minutes.'};}},

  climb:{label:'Climb gradient',gen(){
    const v=R(0,3);
    if(v===1){const gs=pick([120,180,240,300]),npm=gs/60,g=pick([200,250,300,350,400,450,500,600]),fpm=g*npm;
      return{q:pick([`You can hold ${N(fmt(fpm)+' fpm')} at ${N(gs+' kt')} groundspeed. What climb gradient is that?`,`Climbing ${N(fmt(fpm)+' fpm')} at ${N(gs+' kt')}. How many feet per nm?`]),
        unit:'ft/nm',ans:g,tol:10,steps:[`${gs} ÷ 60 = ${npm} nm/min`,`Feet per minute ÷ nm per minute: ${fmt(fpm)} ÷ ${npm}`,...divSteps(fpm,npm)],say:'Gradient = climb rate ÷ nm per minute.'};}
    if(v===2){const p=pick([2,3,4,5,6,8]),gs=R(12,30)*10,fpm=p*gs,exact=Math.round(p/100*6076*gs/60);
      return{q:pick([`The SID requires a ${N(p+'%')} climb gradient. Groundspeed ${N(gs+' kt')}. Roughly what climb rate?`,`Chart shows ${N(p+'%')} climb gradient. At ${N(gs+' kt')}, approximate fpm?`]),
        unit:'fpm',ans:fpm,exact,tol:Math.round(fpm*.05),steps:[`Shortcut: fpm ≈ gradient % × groundspeed`,...mulSteps(p,gs),`Exact is ${fmt(exact)} fpm, close enough`],say:'Percent gradient times groundspeed gives fpm.'};}
    if(v===3){const g=pick([200,250,300,400,500]),nm=pick([4,5,6,8,10,12]),from=pick([0,500,1000,1500]),to=from+g*nm;

        unit:'ft/nm',ans:g,tol:10,steps:[`Climb needed: ${fmt(to)} − ${fmt(from)} = ${fmt(to-from)} ft`,`Feet ÷ miles: ${fmt(to-from)} ÷ ${nm}`,...divSteps(to-from,nm)],say:'Feet to climb divided by the distance.'};}
    const g=pick([200,250,300,350,400,450,500,600]),gs=R(4,10)*30,npm=gs/60,fpm=g*npm;
    return{q:pick([`SID requires ${N(g+' ft/nm')}. Groundspeed ${N(gs+' kt')}. Minimum climb rate?`,`Climb gradient ${N(g+' feet per nm')} at ${N(gs+' kt')}. What fpm do you need?`,`Walk me through it: ${N(g+' ft/nm')} required, ${N(gs+' kt')} over the ground. Rate?`]),
      unit:'fpm',ans:fpm,tol:50,steps:[`${gs} ÷ 60 = ${npm} nm/min`,`Feet per nm × nm per minute: ${g} × ${npm}`,...mulSteps(g,npm)],say:'Gradient times nm per minute. Same as GS ÷ 60, then multiply.'};}},
  xwind:{label:'Crosswind',gen(){return xwind('hard');}},
  tz:{label:'Time zones',gen(){return tzq('hard');}},
  tmath:{label:'Time math',gen(){return tm('hard');}},

function mCat(a,b){const lo=Math.min(a,b),hi=Math.max(a,b);
  if(lo===1||hi===10)return'rule';if(lo===2||lo===5||hi===5)return'pat';if(lo===hi)return'sq';return'core';}
const MH={'3,4':'Double-double 3: 6, 12','3,6':'Double 3×3: 9 + 9','3,7':'2×7 + 7 = 14 + 7','3,8':'Double 3 three times: 6, 12, 24','3,9':'3×10 − 3 = 30 − 3',
  '4,6':'Double-double 6: 12, 24','4,7':'Double-double 7: 14, 28','4,8':'Double-double 8: 16, 32','4,9':'4×10 − 4 = 40 − 4',
  '6,7':'6×6 + 6 = 36 + 6','6,8':'5×8 + 8 = 40 + 8','6,9':'6×10 − 6 = 60 − 6','7,8':'5, 6, 7, 8: 56 = 7×8','7,9':'7×10 − 7 = 70 − 7','8,9':'8×10 − 8 = 80 − 8'};
function mHint(a,b){const lo=Math.min(a,b),hi=Math.max(a,b),k=mCat(a,b);
  if(lo===1)return`Anything × 1 is itself: ${hi}`;
  if(hi===10)return`× 10 adds a zero: ${lo} → ${lo*10}`;
  if(lo===2)return`× 2 is doubling: ${hi} + ${hi}`;
  if(k==='pat'){const o=lo===5?hi:lo;return`× 5 is half of × 10: ${o*10} ÷ 2`;}
  if(k==='sq'){const n=lo;return n===9?'Anchor square (9×10 − 9 = 90 − 9)':'Anchor square';}
  return MH[lo+','+hi];}
function mTable(a,b){const lo=Math.min(a,b),hi=Math.max(a,b);let h='<div class="mt" role="img" aria-label="Multiplication table, '+a+' times '+b+' highlighted"><div class="hd">×</div>';
  for(let j=1;j<=10;j++)h+=`<div class="hd${j===b?' on':''}">${j}</div>`;
  for(let i=1;i<=10;i++){h+=`<div class="hd${i===a?' on':''}">${i}</div>`;
    for(let j=1;j<=10;j++){const hit=(i===a&&j===b)||(i===lo&&j===hi);h+=`<div class="${i>j?'mir':mCat(i,j)}${hit?' hit':''}">${i*j}</div>`;}}
  h+='</div><ul class="legend"><li><i style="background:var(--t-rule)"></i>Rule</li><li><i style="background:var(--t-pat)"></i>Pattern</li><li><i style="background:var(--t-sq)"></i>Anchor square</li><li><i style="background:var(--t-core)"></i>Practice set</li><li><i style="background:var(--t-mir)"></i>Mirror</li></ul>';
  return h;}
// Easy and medium: one fixed phrasing per skill; easy uses round numbers, medium uses everyday numbers
const SIMPLE={
  desc(e){const from=e?pick([20000,25000,30000,35000,40000]):R(24,41)*1000,to=e?pick([3000,5000,6000,10000,15000]):R(3,17)*1000,d=(from-to)/1000*3;
    return{q:`Descend from ${N(fl(from))} to ${N(fl(to))}. How many nm before the fix do you start down?`,unit:'nm',ans:d,tol:e?0:2,
      steps:[`${fmt(from)} − ${fmt(to)} = ${fmt(from-to)} ft`,`${(from-to)/1000} × 3 = ${d} nm`],say:'Altitude to lose in thousands, times three.'};},
  slow(e){const from=e?pick([25000,30000,35000,40000]):R(24,39)*1000,v2=e?pick([250,200]):pick([210,220,230,240,250]),to=e?(v2===250?pick([3000,5000,6000]):pick([5000,6000,10000])):nt(R(4,15)*1000,v2),v1=e?pick([300,280]):R(28,32)*10,b=(from-to)/1000*3,dv=v1-v2,d=b+dv/10;

      steps:[`${gs} ÷ 60 = ${npm} nm/min`,`${nm} ÷ ${npm} = ${m} min`,...divSteps(alt,m)],say:'Turn distance into minutes, then divide the altitude.'};},

    const gs=head?tas-w:tas+w,npm=gs/60,m=e?pick([5,10,15,20]):(gs%60?pick([4,6,8,10,12,20]):R(3,20)),dist=npm*m;
    return{q:`Travel ${N(dist+' nm')} at ${N(tas+' TAS')} with a ${N(w+' kt '+(head?'headwind':'tailwind'))}. How many minutes?`,unit:'min',ans:m,tol:e?0:0.5,
      steps:[`GS = ${tas} ${head?'−':'+'} ${w} = ${gs} kt`,`${gs} ÷ 60 = ${npm} nm/min`,...divSteps(dist,npm)],say:'Groundspeed first, then distance over groundspeed.'};},
  npm(e){const gs=e?R(1,9)*60:R(2,18)*30,n=gs/60;
    return{q:`Groundspeed ${N(gs+' kt')}. How many nautical miles per minute?`,unit:'nm/min',ans:n,tol:0,
      steps:divSteps(gs,60),say:'Groundspeed divided by 60. Every 30 knots is half a mile a minute.'};},
  fuel(e){const rate=e?pick([1000,2000]):pick(DUMP),min=e?R(2,10):pick(DMIN),amt=rate*min;
    return{q:`Dumping fuel at ${N(fmt(rate)+' lb/min')}. How long to dump ${N(fmt(amt)+' lb')}?`,unit:'min',ans:min,tol:0,
      steps:divSteps(amt,rate),say:'Drop matching zeros, then make the divisor round.'};},
  hold(e){const pm=e?pick([20,30,40,50,60,100]):pick([40,50,60,70,80,100]),ph=pm*60,m=e?pick([5,10,15,20,30,60]):holdMin(pm,[10,15,20,25,30,40,45]),mn=e?pick([4000,5000,6000]):pick([4500,5000,6000]),fob=mn+pm*m;
    return{q:`Fuel on board ${N(fmt(fob)+' lb')}, minimum landing fuel ${N(fmt(mn)+' lb')}. Burning ${N(fmt(ph)+' lb/hr')}. How many minutes can you hold?`,unit:'min',ans:m,tol:e?0:1,
      steps:[`Extra fuel: ${fmt(fob)} − ${fmt(mn)} = ${fmt(fob-mn)} lb`,`Burn per minute: ${fmt(ph)} ÷ 60 = ${pm} lb/min`,`Minutes: ${fmt(fob-mn)} ÷ ${pm}`,...divSteps(fob-mn,pm)],say:'Fuel above minimum, divided by burn per minute.'};},
  xwind(e){return xwind(e?'easy':'medium');},
  tz(e){return tzq(e?'easy':'medium');},
  tmath(e){return tm(e?'easy':'medium');},

  climb(e){const g=e?pick([200,300,400,500]):pick([200,250,300,350,400,450,500,600]),gs=e?pick([120,180,240,300]):R(4,10)*30,npm=gs/60,fpm=g*npm;
    return{q:`SID requires ${N(g+' ft/nm')}. Groundspeed ${N(gs+' kt')}. Minimum climb rate?`,unit:'fpm',ans:fpm,tol:e?0:50,
      steps:[`${gs} ÷ 60 = ${npm} nm/min`,`Feet per nm × nm per minute: ${g} × ${npm}`,...mulSteps(g,npm)],say:'Gradient times nm per minute.'};},
};

const $=id=>document.getElementById(id);

// ---- Adaptive engine (Leitner boxes) ----
// Every answer updates its items: a fast correct answer moves an item up a box, a slow one caps it at box 1, a miss drops it to box 0.

const BOXW=[10,6,3.5,2,1.2,0.7],NEWW=4,SKW=[3,2.2,1.6,1.2,1,.8],SKNEW=1.5;

const TARGET={desc:30,slow:45,rate:15,vsreq:60,wind:45,npm:10,fuel:30,hold:60,climb:20,xwind:20,tz:20,tmath:20,recip:6,mult:4};
let items=load('dmd-items')||{},qn=load('dmd-qn')||0;
if(!load('dmd-tv2')){Object.keys(items).forEach(k=>{const it=items[k];if(k.startsWith('s:')&&it.lastSlow){it.lastSlow=false;if(it.lastOk&&it.box<2)it.box=2;}});store('dmd-items',items);store('dmd-tv2',1);}
(()=>{const old=load('dmd-miss');if(Array.isArray(old)){old.forEach(k=>{if(/^[2-9]x[2-9]$/.test(k)&&!items['m:'+k])items['m:'+k]={n:1,ok:0,slow:0,box:0,sec:0,lastQ:0,lastSlow:false,lastOk:false};});store('dmd-items',items);store('dmd-miss',null);}})();
function bump(key,ok,sec,target){const it=items[key]=items[key]||{n:0,ok:0,slow:0,box:0,sec:0,lastQ:0};
  const slow=ok&&sec>target;it.n++;if(ok)it.ok++;if(slow)it.slow++;it.sec=it.sec?it.sec*.7+sec*.3:sec;it.lastQ=qn;it.lastOk=ok;it.lastSlow=slow;it.t=Date.now();
  it.box=!ok?0:slow?Math.min(it.box,1):Math.min(5,it.box+1);}
function logAnswer(c,ok,sec){qn++;bump('s:'+c.key,ok,sec,TARGET[c.key]);(c.items||[]).forEach(k=>bump(k,ok,sec,c.target||TARGET[c.key]));
  const lg=load('dmd-log')||{},a=lg[c.key]=lg[c.key]||[];a.push([ok?1:0,sec,c.target||TARGET[c.key]]);if(a.length>50)a.splice(0,a.length-50);
  store('dmd-log',lg);store('dmd-items',items);store('dmd-qn',qn);}
function wOf(key,boxw,neww){const it=items[key];if(!it)return neww;let w=boxw[it.box];const gap=qn-it.lastQ;if(gap<3)w*=.1;else if(gap<6)w*=.5;return w;}
function wpick(keys,boxw=BOXW,neww=NEWW){const ws=keys.map(k=>wOf(k,boxw,neww)),tot=ws.reduce((a,b)=>a+b,0);let r=Math.random()*tot;for(let i=0;i<keys.length;i++){r-=ws[i];if(r<=0)return keys[i];}return keys[keys.length-1];}
const pickSkill=()=>wpick(chosen.map(k=>'s:'+k),SKW,SKNEW).slice(2);

// Math skills: 2-9 facts in three forms, plus technique problems (BRIDGE) that use the facts the way the aviation math does
const FACTS=[];for(let a=2;a<=9;a++)for(let b=a;b<=9;b++)FACTS.push('m:'+a+'x'+b);

function mNext(){let key;const due=FACTS.concat(BKEYS).filter(k=>items[k]&&items[k].box===0&&qn-items[k].lastQ>=3&&k!==lastM);
  if(due.length&&Math.random()<.5)key=pick(due);else for(let i=0;i<10;i++){key=Math.random()<.45?wpick(FACTS):wpick(BKEYS);if(key!==lastM)break;}lastM=key;
  if(BRIDGE[key]){const g=BRIDGE[key].gen();return Object.assign(g,{unit:'',tol:g.tol||0,items:[key],target:15});}
  const [lo,hi]=key.slice(2).split('x').map(Number),swap=Math.random()<.5,a=swap?hi:lo,b=swap?lo:hi,p=a*b,it=items[key],strong=it&&it.box>=3;
  const r=Math.random(),form=r<(strong?.3:.6)?'fwd':r<(strong?.65:.8)?'rev':'div',tbl=mTable(a,b),hint=mHint(a,b);
  if(form==='rev'){const left=Math.random()<.5,known=left?b:a,miss=left?a:b;
    return{q:`<span class="n">${left?'?':a} × ${left?b:'?'} = ${p}</span>`,unit:'',ans:miss,tol:0,items:[key],target:4,

      steps:[`${a} × ${b} = ${p}, so ${p} ÷ ${a} = ${b}`,hint],extra:tbl,say:'Division is the times table read backwards.'};
  return{q:`<span class="n">${a} × ${b}</span> = ?`,unit:'',ans:p,tol:0,items:[key],target:3,steps:[`${a} × ${b} = ${p}`,hint],extra:tbl,say:'Answer from memory. Target: under 3 seconds, no counting.'};}

const dstr=t=>new Date(t).toLocaleDateString(undefined,{month:'short',day:'numeric'});
function trendSvg(hist){const W=600,H=190,L=34,Rp=12,T=12,B=28,pts=hist.slice(-20),n=pts.length,x=i=>L+(n===1?(W-L-Rp)/2:i*(W-L-Rp)/(n-1)),lo=Math.max(0,Math.min(50,Math.floor((Math.min(...pts.map(p=>p.pct))-10)/10)*10)),y=v=>T+(100-v)*(H-T-B)/(100-lo);
  let g=`<svg class="trend" viewBox="0 0 ${W} ${H}" role="img" aria-label="Session scores, last ${n} sessions">`;
  for(const v of [lo,50,75,90,100].filter((v,i,a)=>v>=lo&&a.indexOf(v)===i)){g+=`<line x1="${L}" x2="${W-Rp}" y1="${y(v)}" y2="${y(v)}" stroke="var(--rule)" stroke-width="1"${v===90?' stroke-dasharray="4 4"':''}/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${v}</text>`;}
  const path=pts.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)} ${y(p.pct).toFixed(1)}`).join(' ');
  g+=`<path d="${path} L${x(n-1).toFixed(1)} ${y(lo)} L${x(0).toFixed(1)} ${y(lo)} Z" fill="var(--magenta)" fill-opacity=".08"/><path d="${path}" fill="none" stroke="var(--magenta)" stroke-width="2.5" stroke-linejoin="round"/>`;

function renderProg(){const el=$('progView'),hist=load('dmd-hist')||[],misses=load('dmd-misses')||[],sk=skillStats(),answered=sk.reduce((s,x)=>s+x.all,0);

  h+=`<button type="button" class="btn ghost sm" id="resetBtn">Reset progress</button>`;
  el.innerHTML=h;
  el.querySelectorAll('[data-k]').forEach(b=>b.addEventListener('click',()=>{el.querySelectorAll('.sel').forEach(x=>x.classList.remove('sel'));el.querySelectorAll(`[data-k="${b.dataset.k}"]`).forEach(x=>x.classList.add('sel'));

    items={};qn=0;['dmd-items','dmd-qn','dmd-log','dmd-hist','dmd-misses'].forEach(k=>store(k,null));renderProg();});}

    for(let i=0;i<18;i++){const p=document.createElement('i');p.className='spark'+(i%2?' sq':'');p.style.left=cx+'px';p.style.top=cy+'px';p.style.background=cols[i%3];document.body.appendChild(p);
      const a=Math.PI*2*i/18+Math.random()*.35,d=45+Math.random()*45,x=Math.cos(a)*d,y=Math.sin(a)*d;
      p.animate([{transform:'translate(-50%,-50%) scale(1) rotate(0deg)',opacity:1},{transform:`translate(calc(-50% + ${x}px),calc(-50% + ${y+18}px)) scale(.35) rotate(${180+Math.random()*180}deg)`,opacity:0}],{duration:650+Math.random()*250,easing:'cubic-bezier(.15,.7,.35,1)'}).onfinish=()=>p.remove();}
    $('sRight').animate([{transform:'scale(1)'},{transform:'scale(1.5)',color:cols[1]},{transform:'scale(1)'}],{duration:500,easing:'ease-out'});}
  setTimeout(()=>{b.classList.remove('ok');b.textContent='Check';q.classList.remove('done');advancing=false;next();},note?2600:reduce?600:950);}

$('form').addEventListener('submit',e=>{e.preventDefault();if(!cur||advancing||!ses)return;const raw=$('answer').value.trim(),v=parseFloat((cur.time||cur.dur?raw.replace(/[.:]/g,''):raw).replace(/[,:]/g,''));if(isNaN(v))return;
  const ok=cur.hdg?(v%360||360)===cur.ans:cur.time?v%2400===cur.ans:cur.dur||cur.rwy?v===cur.ans:Math.abs(v-cur.ans)<=cur.tol,sec=answered?elapsed():record(ok);
  if(ok)celebrate(sec,v);else show('bad',`Answer is ${fa(cur)}${cur.unit?' '+cur.unit:''}`);});
$('revealBtn').onclick=()=>{if(!cur||advancing||!ses)return;record(false);show('reveal',`Answer: ${fa(cur)}${cur.unit?' '+cur.unit:''}`);};
const goNext=()=>{if(advancing||!ses)return;if(!answered)record(false,true);next();};
$('nextBtn').onclick=goNext;
// Keep the answer field focused when tapping Check or Next, so the phone keyboard stays up between questions
function keepFocus(btn,act){const nf=e=>{if(document.activeElement===$('answer'))e.preventDefault();};
  btn.addEventListener('mousedown',nf);
  btn.addEventListener('touchstart',e=>{if(document.activeElement===$('answer')){e.preventDefault();btn._kf=true;}},{passive:false});
  btn.addEventListener('touchend',e=>{if(btn._kf){btn._kf=false;e.preventDefault();act();}},{passive:false});}
keepFocus($('checkBtn'),()=>{const f=$('form');f.requestSubmit?f.requestSubmit():f.dispatchEvent(new Event('submit',{cancelable:true}));});
keepFocus($('nextBtn'),goNext);

// Start, stop, score
const clampN=n=>Math.max(5,Math.min(100,Math.round(n)||20));
let count=clampN(load('dmd-count')||20);
function renderCount(){$('count').value=count;const m=Math.round(count*PER_Q/60);$('est').textContent=`about ${m<1?'1':m} min`;}
$('cMinus').onclick=()=>{count=clampN(count-5);store('dmd-count',count);renderCount();};
$('cPlus').onclick=()=>{count=clampN(count+5);store('dmd-count',count);renderCount();};
$('count').addEventListener('change',()=>{count=clampN(parseFloat($('count').value));store('dmd-count',count);renderCount();});
$('startBtn').onclick=()=>{count=clampN(parseFloat($('count').value));store('dmd-count',count);ses={n:count,res:[]};saveSes();view('play');next();};
$('stopBtn').onclick=()=>{if(!ses||advancing)return;if(!ses.res.length){ses=null;store('dmd-session',null);clearInterval(tick);view('start');return;}finish();};
const mmss=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
function finish(){clearInterval(tick);const r=ses.res,n=r.length,right=r.filter(x=>x.ok).length,t=r.reduce((a,x)=>a+x.sec,0),pct=n?Math.round(right/n*100):0;
  const early=n<ses.n,verdict=pct>=90?'Interview ready':pct>=75?'Solid':pct>=50?'Getting there':'Keep drilling';
  const by={};r.forEach(x=>{const b=by[x.k]=by[x.k]||{n:0,ok:0,t:0};b.n++;b.t+=x.sec;if(x.ok)b.ok++;});
  const rows=Object.keys(by).length>1?`<table class="bk"><thead><tr><th>Skill</th><th>Right</th><th>Avg</th></tr></thead><tbody>${Object.entries(by).sort((a,b)=>a[1].ok/a[1].n-b[1].ok/b[1].n).map(([k,b])=>`<tr><td>${TYPES[k].label}</td><td>${b.ok}/${b.n}</td><td>${Math.round(b.t/b.n)}s</td></tr>`).join('')}</tbody></table>`:'';
  const miss=r.filter(x=>!x.ok);
  $('sumView').innerHTML=`<div class="score ${pct>=75?'hi':pct>=50?'mid':'lo'}"><div class="pct">${pct}<small>%</small></div><div class="sline"><div class="vword">${verdict}</div><div class="smeta">${right} of ${n} right${early?` · ended early (${n} of ${ses.n})`:''}<br>Avg ${n?Math.round(t/n):0}s per question · ${mmss(t)} total</div></div></div>
    ${rows}${miss.length?`<div class="misses"><div class="lbl">Missed</div><ol>${miss.map(x=>`<li><span>${esc(x.q)}</span><b>${x.skip?'Skipped · ':''}${esc(x.a)}</b></li>`).join('')}</ol></div>`:''}
    <button class="btn" type="button" id="againBtn">New session</button>`;
  const hist=load('dmd-hist')||[];hist.push({t:Date.now(),n,pct,avg:n?Math.round(t/n):0,label:$('sesInfo').textContent});if(hist.length>30)hist.splice(0,hist.length-30);store('dmd-hist',hist);
  ses=null;store('dmd-session',null);try{$('answer').blur()}catch(e){}
  view('sum');$('againBtn').onclick=()=>{view('start');renderCount();};
  if(pct>=90&&!matchMedia('(prefers-reduced-motion: reduce)').matches){const b=$('sumView').querySelector('.pct');b.animate([{transform:'scale(.6)',opacity:0},{transform:'scale(1.08)',opacity:1},{transform:'scale(1)'}],{duration:600,easing:'cubic-bezier(.3,1.6,.5,1)'});}}
(()=>{const s=load('dmd-sel');if(Array.isArray(s))chosen=s.filter(k=>TYPES[k]);else{let m=null;try{m=localStorage.getItem('dmd-mode')}catch(e){}chosen=m&&TYPES[m]?[m]:MIXED.slice();}
  if(!chosen.length&&!Array.isArray(s))chosen=MIXED.slice();})();
function setChosen(list){chosen=MIXED.filter(k=>list.includes(k));store('dmd-sel',chosen);renderLvl();renderSel();}
function renderSel(){const n=chosen.length;$('startBtn').disabled=!n;$('selInfo').textContent=!n?'Pick at least one skill below':n===MIXED.length?'All skills, mixed':n===1?TYPES[chosen[0]].label+' only':`${n} skills, mixed`;
  document.querySelectorAll('#skillTbl input[data-sk]').forEach(c=>{c.checked=chosen.includes(c.dataset.sk);c.closest('tr').classList.toggle('on',c.checked);});
  const all=$('skAll');if(all){all.checked=n===MIXED.length;all.indeterminate=n>0&&n<MIXED.length;}}
try{const l=localStorage.getItem('dmd-level');if(LEVELS.includes(l))lvl=l;}catch(e){}
const LVL_OPTS=[['easy','Easy'],['medium','Medium'],['hard','Hard']];
function renderLvl(){$('lvlWrap').hidden=onlyMult();$('multNote').hidden=!onlyMult();
  $('lvl').innerHTML=LVL_OPTS.map(([v,t])=>`<button type="button" role="radio" id="lvl-${v}" data-l="${v}" aria-checked="${v===lvl}">${t}</button>`).join('');}
$('lvl').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||ses)return;const v=b.dataset.l;
  if(lvl===v)return;lvl=v;try{localStorage.setItem('dmd-level',v)}catch(e){}
  renderLvl();});
renderCount();if(ses){view('play');next();}else view('start');renderSel();
})();
</script>

<script>if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}</script>
</body>
